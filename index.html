<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ТРЕШ — интерактивный симулятор бюджета</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f4f6fb;--card:#fff;--ink:#1e2340;--muted:#8a90b8;--line:#e8eaf6;
--indigo:#5346e8;--indigo-soft:#eeeaff;--navy:#201d4f;
--green:#16a34a;--green-soft:#e7f8ee;--red:#e11d48;--red-soft:#fdeaef;
--blue:#2563eb;--blue-soft:#e8efff;--purple:#8b5cf6;--purple-soft:#f1eaff;
--orange:#ea580c;--banner:#fff7e0;--banner-line:#f5e2b0;
--r:18px;--sh:0 4px 20px rgba(30,35,64,.06);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-top:env(safe-area-inset-top)}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:40px 32px;text-align:center;max-width:380px;width:100%}
.logo-tile{width:72px;height:72px;border-radius:20px;background:var(--indigo);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}
.logo-tile .ic{width:34px;height:34px}
.login-card h1{font-size:26px;font-weight:800;letter-spacing:.5px}
.login-card p{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:6px 0 24px}
.g-btn{width:100%;min-height:52px;background:#fff;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink);transition:transform .15s,box-shadow .15s}
.g-btn:active{transform:scale(.98)}
/* ---------- TOPBAR ---------- */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top))}
.tb-logo{width:42px;height:42px;border-radius:12px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tb-title b{font-size:16px;font-weight:800;display:block;line-height:1.2}
.tb-title span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.tb-metrics{display:flex;gap:28px;margin:0 auto}
.tb-metric{text-align:center}
.tb-metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tb-metric b{font-size:15px;font-family:'SF Mono',Consolas,monospace}
.tb-metric b.grn{color:var(--ink)}.tb-metric b.blu{color:var(--blue)}.tb-metric b.pur{color:var(--purple)}
.tb-badge{margin-left:auto;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
/* ---------- SHELL ---------- */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.sidebar{position:sticky;top:80px;align-self:start;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sb-cap{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:4px 8px 10px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:transparent;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:6px;transition:background .15s}
.nav-btn .ic{color:var(--muted)}
.nav-btn.on{background:var(--indigo);color:#fff;box-shadow:0 6px 16px rgba(83,70,232,.35)}
.nav-btn.on .ic{color:#fff}
.tip{margin-top:14px;background:#f8f9ff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:#5a5f82}
.tip b{display:flex;gap:7px;align-items:center;color:var(--ink);margin-bottom:6px}
.tip .ic{width:16px;height:16px;color:var(--indigo)}
/* ---------- HERO ---------- */
.hero{background:linear-gradient(120deg,#262254,#1a1740);border-radius:20px;color:#fff;padding:24px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden}
.hero-badge{display:inline-block;background:rgba(255,255,255,.14);font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:10px}
.hero-contr{font-size:12px;color:#b9bce0;margin-left:8px}
.hero h2{font-size:26px;font-weight:800;margin:2px 0 6px}
.hero-addr{font-size:12.5px;color:#b9bce0;display:flex;gap:6px;align-items:center}
.hero-addr .ic{width:14px;height:14px;color:#ff8a8a}
.hero-bal{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 20px;text-align:center;min-width:230px}
.hero-bal span{font-size:11.5px;color:#b9bce0}
.hero-bal b{display:block;font-size:26px;font-family:'SF Mono',Consolas,monospace;color:#8f88ff;margin:4px 0}
.hero-bal i{font-style:normal;font-size:11px;color:#4ade80;display:flex;gap:6px;align-items:center;justify-content:center}
/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;position:relative}
.stat header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.stat h4{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;max-width:75%}
.stat-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.stat .val{font-size:22px;font-weight:800;font-family:'SF Mono',Consolas,monospace}
.stat .val small{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:5px 11px;margin-top:10px}
.c-grn{background:var(--green-soft);color:var(--green)}.c-blu{background:var(--blue-soft);color:var(--blue)}
.c-red{background:var(--red-soft);color:var(--red)}.c-pur{background:var(--purple-soft);color:var(--purple)}
.ic-grn{background:var(--green-soft);color:var(--green)}.ic-blu{background:var(--blue-soft);color:var(--blue)}
.ic-red{background:var(--red-soft);color:var(--red)}.ic-pur{background:var(--purple-soft);color:var(--purple)}
.bar{height:7px;background:#eef0f8;border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-note{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
/* ---------- BANNER ---------- */
.banner{background:var(--banner);border:1px solid var(--banner-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:20px}
.banner-ic{width:40px;height:40px;border-radius:11px;background:#fde8c8;color:var(--orange);display:flex;align-items:center;justify-content:center;flex:none}
.banner b{color:#b45309;font-size:14.5px}
.banner p{font-size:12.5px;color:#92700a;margin-top:3px}
.banner button{margin-left:auto;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:12px 18px;border-radius:11px;flex:none;min-height:44px}
/* ---------- COLUMNS ---------- */
.cols{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.col-cap{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.col-cap em{font-style:normal;color:var(--red);font-size:12px}
.rec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.rec header{display:flex;gap:12px;align-items:flex-start}
.rec-ic{width:40px;height:40px;border-radius:11px;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex:none}
.rec h5{font-size:15px;font-weight:700}
.rec header span{font-size:11.5px;color:var(--muted)}
.rec p{font-size:13px;color:#5a5f82;margin:10px 0}
