<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firebasestorage.googleapis.com https://api.github.com https://apis.google.com https://accounts.google.com https://www.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://*.web.app https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>МАЯК — деньги под контролем</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="errbar.js"></script>
</head>
<body>



<div id="login" class="page on">
  <div class="lcard glass">
    <div class="logo"><svg class="ic"><use href="#i-beam"/></svg></div>
    <h1>МАЯК</h1>
    <p>Подсвечивает рифы. Ведёт к цели</p>

    <div class="au-tabs">
      <button id="tabIn" class="on" data-act="au-tab" data-v="in">Вход</button>
      <button id="tabUp" data-act="au-tab" data-v="up">Регистрация</button>
    </div>
    <div class="form" style="margin-top:14px">
      <input class="inp" id="auMail" type="email" inputmode="email" placeholder="E-mail" autocomplete="email">
      <input class="inp" id="auPass" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn-a" id="auGo" data-act="au-login">Войти</button>
      <button class="au-link" data-act="au-reset">Забыли пароль?</button>
    </div>

    <div class="au-or">или</div>
    <button id="googleBtn" class="btn-g">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38 15.21 9l4.79-4.86C17.45 1.44 14.97 0 12 0 7.7 0 3.99 2.47 2.18 6.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Войти через Google
    </button>
    <p class="au-priv">Каждый аккаунт — отдельное закрытое хранилище. Ваши деньги видны только вам.</p>
    <button class="btn-demo" data-act="demo-enter">Посмотреть демо-версию</button>
    <div class="hint" style="text-align:center;margin-top:6px">вымышленные цифры · вход не нужен · ничего не сохраняется</div>
  </div>
</div>
</div>

<div id="app" class="hidden">
  <nav id="rail" class="glass">
    <button data-act="nav" data-p="dash" class="on"><svg class="ic"><use href="#i-grid"/></svg><span class="lbl">Панель</span></button>
    <button data-act="nav" data-p="spend"><svg class="ic"><use href="#i-out"/></svg><span class="lbl">Траты</span></button>
    <button data-act="nav" data-p="income"><svg class="ic"><use href="#i-in"/></svg><span class="lbl">Доходы</span></button>
    <button data-act="nav" data-p="budget"><svg class="ic"><use href="#i-map"/></svg><span class="lbl">Бюджет</span></button>
    <button data-act="nav" data-p="learn"><svg class="ic"><use href="#i-book"/></svg><span class="lbl">Обучение</span></button>
    <button data-act="nav" data-p="chat"><svg class="ic"><use href="#i-bot"/></svg><span class="lbl">Копилот</span></button>
    <button data-act="nav" data-p="settings"><svg class="ic"><use href="#i-cog"/></svg><span class="lbl">Настройки</span></button>
    <button data-act="exit"><svg class="ic"><use href="#i-exit"/></svg><span class="lbl">Выйти</span></button>
  </nav>

  <div class="top glass">
    <div class="logo"><svg class="ic"><use href="#i-beam"/></svg></div>
       <div><b>МАЯК</b><small>финансовый навигатор</small><small id="buildInfo" style="opacity:.65"></small></div>
    <div class="sync"><i></i><span id="mMail">Firebase</span></div>
  </div>

  <div id="pageContent"></div>

  <nav id="bnav" class="glass">
    <button data-act="nav" data-p="dash" class="on"><svg class="ic"><use href="#i-grid"/></svg><span>Главная</span></button>
    <button data-act="nav" data-p="spend"><svg class="ic"><use href="#i-out"/></svg><span>Траты</span></button>
    <button data-act="nav" data-p="income"><svg class="ic"><use href="#i-in"/></svg><span>Доход</span></button>
    <button data-act="nav" data-p="budget"><svg class="ic"><use href="#i-map"/></svg><span>Бюджет</span></button>
    <button data-act="nav" data-p="learn"><svg class="ic"><use href="#i-book"/></svg><span>Обучение</span></button>
    <button data-act="nav" data-p="chat"><svg class="ic"><use href="#i-bot"/></svg><span>Копилот</span></button>
    <button data-act="nav" data-p="settings"><svg class="ic"><use href="#i-cog"/></svg><span>Настройки</span></button>
  </nav>

  <div id="shb"></div>
  <div id="sheet">
    <div id="sheetBody"></div>
  </div>
</div>

<script src="icons.js"></script>


<script type="module" src="app.js"></script>
</body>
</html>
