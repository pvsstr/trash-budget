<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>ТРЕШ — семейный бюджет</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('dbg');
  if(!d){d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#401010;color:#ffd7d7;padding:10px 14px;font:12px monospace;z-index:99999;white-space:pre-wrap';document.body.appendChild(d);}
  d.textContent='ОШИБКА ПРИЛОЖЕНИЯ: '+e.message+' (строка '+e.lineno+')';
},true);
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07080c;--txt:#f2f4ff;--mut:#8b91a7;--stroke:rgba(255,255,255,.09);
--acc:#0a84ff;--teal:#64d2ff;--grn:#30d158;--red:#ff453a;--org:#ff9f0a;--pur:#bf5af2;--pink:#ff375f;--r:24px}
body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;font-variant-numeric:tabular-nums;line-height:1.55;font-size:15px}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:
radial-gradient(40% 35% at 20% 15%,rgba(10,132,255,.16),transparent 60%),
radial-gradient(35% 30% at 85% 20%,rgba(191,90,242,.13),transparent 60%),
radial-gradient(45% 40% at 60% 90%,rgba(48,209,88,.08),transparent 60%)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt)}
select option{background:#141622}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
border:1px solid var(--stroke);border-radius:var(--r);
box-shadow:0 12px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.hov{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;cursor:pointer}
@media(hover:hover){.hov:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24);
box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 24px rgba(10,132,255,.14),inset 0 1px 0 rgba(255,255,255,.2)}}
.hov:active{transform:scale(.97);transition-duration:.12s}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{max-width:380px;width:100%;padding:44px 32px;text-align:center}
.logo{width:76px;height:76px;border-radius:22px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,var(--acc),var(--pur));box-shadow:0 10px 34px rgba(10,132,255,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.logo .ic{width:34px;height:34px;color:#fff}
.lcard h1{font-size:30px;font-weight:800}
.lcard p{color:var(--mut);font-size:13px;margin:8px 0 28px}
.gbtn{width:100%;min-height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;
background:rgba(255,255,255,.1);border:1px solid var(--stroke);backdrop-filter:blur(16px);transition:.25s}
.gbtn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
#app{max-width:1240px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;margin-bottom:16px;position:sticky;top:10px;z-index:40}
.top .logo{width:40px;height:40px;border-radius:13px;margin:0;box-shadow:none}
.top .logo .ic{width:20px;height:20px}
.top b{font-size:17px;font-weight:800}
.top small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:1.2px}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--grn);
background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.3);padding:8px 14px;border-radius:999px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--grn)}

/* BENTO HERO & DASHBOARD STYLES */
.dash-hero {
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; padding: 24px; margin-bottom: 16px; flex-wrap: wrap;
}
.hero-left { display: flex; flex-direction: column; gap: 6px; }
.hero-left h2 { font-size: 26px; font-weight: 800; }
.hero-left .date { color: var(--mut); font-size: 13px; }
.health-score-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, 0.06); padding: 6px 14px;
  border-radius: 999px; border: 1px solid var(--stroke); width: fit-content; margin-top: 8px;
}
.score-val { font-weight: 800; font-size: 14px; color: var(--teal); }
.score-lbl { font-size: 11px; color: var(--mut); }
.hero-right { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-card {
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--stroke);
  border-radius: 18px; padding: 14px 20px; min-width: 200px; text-align: left;
}
.hero-card span { font-size: 11px; color: var(--mut); display: block; }
.hero-card b { display: block; font-size: 24px; font-weight: 800; margin: 2px 0; color: var(--teal); }
.hero-card small { font-size: 11px; color: var(--grn); }
.limit-status-bar {
  height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; margin-top: 8px; overflow: hidden;
}
.limit-status-bar i { display: block; height: 100%; background: var(--teal); width: 0%; transition: width 0.6s ease; }

.dash-row { display: grid; gap: 16px; margin-bottom: 16px; }
.dash-row.cols-2 { grid-template-columns: 1fr 1fr; }
.card-padding { padding: 18px 20px; }
.cap-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 12px; }
.cap-title span { color: var(--mut); font-weight: 600; }
.cap-title b { font-weight: 800; color: var(--txt); }
.bar-large { height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; }
.bar-large i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--pur)); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
.cycle-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--mut); margin-top: 8px; }

.bento-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat{padding:18px}
.stat header{display:flex;justify-content:space-between;margin-bottom:10px}
.stat h4{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;max-width:70%}
.sic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.stat .val{font-size:22px;font-weight:800}
.stat .val small{font-size:11px;color:var(--mut);font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:5px 11px;margin-top:10px}
.compact-list { display: flex; flex-direction: column; gap: 6px; max-height: 90px; overflow-y: auto; }

.demo-tag{display:inline-flex;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--org);
background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.35);padding:5px 11px;border-radius:999px;margin-bottom:6px;width:fit-content}
.banner{padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:16px;border-color:rgba(255,69,58,.35)!important;
background:linear-gradient(180deg,rgba(255,69,58,.14),rgba(255,69,58,.05))!important}
.banner.ok{border-color:rgba(48,209,88,.35)!important;background:linear-gradient(180deg,rgba(48,209,88,.14),rgba(48,209,88,.05))!important}
.banner .sic{background:rgba(255,69,58,.18);color:var(--red)}
.banner.ok .sic{background:rgba(48,209,88,.18);color:var(--grn)}
.banner b{font-size:14.5px}
.banner p{font-size:12.5px;color:var(--mut);margin-top:3px}
.banner button{margin-left:auto;background:linear-gradient(135deg,var(--red),var(--pink));color:#fff;font-weight:800;font-size:13px;padding:13px 18px;border-radius:14px;min-height:44px}
.cols{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
.cap{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin:4px 4px 12px}
.chart-card{padding:18px;margin-bottom:16px}
.charts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto}
.rec{padding:18px;margin-bottom:12px}
.rec header{display:flex;gap:12px;align-items:center}
.rec h5{font-size:14.5px;font-weight:700}
.rec header span{font-size:11px;color:var(--mut)}
.rec p{font-size:12.5px;color:var(--mut);margin:10px 0}
.rec footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);gap:8px}
.rec footer b{color:var(--red)}
.chev{margin-left:auto;color:var(--mut);transition:transform .25s}
.hov:hover .chev{transform:translateX(4px);color:var(--txt)}
.tx-card{padding:16px}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:none;outline:none}
.search .ic{color:var(--mut);width:17px;height:17px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid rgba(255,255,255,.06);border-radius:12px;transition:background .2s;cursor:pointer}
.tx:hover{background:rgba(255,255,255,.05)}
.tx:last-child{border:none}
.tx-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.tx-body{flex:1;min-width:0}
.tx-body b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-body span{font-size:10.5px;color:var(--mut)}
.tx-right{text-align:right}
.tx-right b{font-size:14px;font-weight:800;display:block}
.tx-right b.pos{color:var(--grn)}
.tx-right span{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.env{padding:16px 18px;margin-bottom:12px}
.env header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.env-name{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.env header b{font-size:13.5px;font-weight:800;text-align:right}
.env header b.over{color:var(--red)}
.env .note{font-size:10.5px;color:var(--mut);margin-top:6px}
.dig-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
.dig-item span{color:var(--mut)}
.dig-item b{font-weight:700}
.dig-item .soon{color:var(--red)}
.tip{padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:16px;border-color:rgba(191,90,242,.3)!important;
background:linear-gradient(180deg,rgba(191,90,242,.12),rgba(191,90,242,.04))!important}
.tip .sic{background:rgba(191,90,242,.18);color:var(--pur)}
.tip b{font-size:13.5px}
.tip p{font-size:12.5px;color:var(--mut);margin-top:3px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 280px);min-height:420px;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:12px 16px;border-radius:18px;font-size:13.5px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.msg.bot{background:rgba(255,255,255,.08);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:linear-gradient(135deg,var(--acc),var(--pur));border-bottom-right-radius:6px;align-self:flex-end}
.msg b{color:var(--teal)}
.chips{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.chip{background:rgba(10,132,255,.14);color:var(--teal);font-size:12px;font-weight:700;padding:10px 14px;border-radius:999px;min-height:38px;transition:.2s}
.chip:hover{background:rgba(10,132,255,.25)}
.chat-in{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--stroke)}
.chat-in input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:12px 16px;outline:none}
.chat-in button{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--pur));color:#fff;display:flex;align-items:center;justify-content:center}
#rail{position:fixed;left:max(12px,calc((100vw - 1240px)/2 - 76px));top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;padding:10px;z-index:50}
#rail button{height:52px;width:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:width .35s cubic-bezier(.2,.8,.2,1),background .25s,color .25s;overflow:hidden;flex:none}
#rail button .lbl{max-width:0;opacity:0;white-space:nowrap;font-size:13px;font-weight:700;transition:max-width .35s,opacity .3s,margin .35s}
#rail button:hover{width:190px;justify-content:flex-start;padding-left:16px;color:var(--txt);background:rgba(255,255,255,.07)}
#rail button:hover .lbl{max-width:130px;opacity:1;margin-left:12px}
#rail button.on{background:linear-gradient(135deg,var(--acc),var(--pur));color:#fff}
#bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;display:grid;grid-template-columns:repeat(6,1fr);padding:8px;max-width:560px;margin:0 auto}
#bnav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--mut);font-size:9px;font-weight:700;border-radius:14px;min-height:50px;transition:.25s}
#bnav button.on{color:var(--txt);background:rgba(10,132,255,.16)}
#bnav .ic{width:20px;height:20px}
#shb{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
#shb.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;
background:rgba(22,24,34,.86);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--stroke);border-bottom:none;
padding:14px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);max-height:82vh;overflow-y:auto}
#sheet.on{transform:none}
#sheet::before{content:'';display:block;width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto 16px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-h .sic{width:44px;height:44px;border-radius:14px}
.sh-h b{font-size:17px}
.sh-h span{display:block;font-size:11px;color:var(--mut)}
.sh-x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.sh-row{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.sh-row span{color:var(--mut)}
.sh-row b{font-weight:800}
.sh-tip{margin-top:14px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.3);border-radius:14px;padding:14px;font-size:13px;color:#bfe0ff}
.sh-btn{width:100%;margin-top:14px;padding:15px;border-radius:15px;background:linear-gradient(135deg,var(--acc),var(--pur));color:#fff;font-weight:800;font-size:14px;min-height:50px}
.sh-btn.ghost{background:rgba(255,255,255,.08);color:var(--txt)}
.sh-btn.danger{background:rgba(255,69,58,.2);color:var(--red)}
textarea{width:100%;height:140px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:12px;outline:none;resize:vertical;font-size:12px}
.form{display:grid;gap:10px}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;outline:none;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msw{display:flex;align-items:center;gap:10px;margin:0 4px 12px}
.msw button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);font-size:18px;flex:none}
.msw b{flex:1;text-align:center;font-size:13px}
.del{width:30px;height:30px;border-radius:99px;background:rgba(255,69,58,.14);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.hint{font-size:10.5px;color:var(--mut);margin-top:-4px}
.addbtn{width:100%;margin:0 0 14px;padding:13px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.2);color:var(--mut);font-weight:700;font-size:13px;transition:.2s}
.addbtn:hover{color:var(--txt);border-color:rgba(255,255,255,.4)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(20,22,34,.95);border:1px solid var(--stroke);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:300;animation:pop .3s}
.page{display:none}.page.on{display:block;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.c-grn{color:var(--grn);background:rgba(48,209,88,.14)}.c-blu{color:var(--teal);background:rgba(10,132,255,.14)}
.c-red{color:var(--red);background:rgba(255,69,58,.14)}.c-pur{color:var(--pur);background:rgba(191,90,242,.14)}
.c-org{color:var(--org);background:rgba(255,159,10,.14)}
@media(min-width:1100px){#rail{display:flex}}
@media(max-width:960px){.cols{grid-template-columns:1fr}.dash-row.cols-2{grid-template-columns:1fr}.bento-stats{grid-template-columns:1fr 1fr}.hero-right{width:100%}.hero-card{flex:1;min-width:140px}#bnav{display:grid}}
@media(min-width:961px){#bnav{display:none}}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3 3 5.5v15L9 18l6 2.5 6-2.5v-15L15 5.5 9 3z"/><path d="M9 3v15M15 5.5v15"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9.5h18"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="3"/><path d="M12 9V6"/><circle cx="12" cy="4" r="1.5"/><path d="M9 13.5v1.5M15 13.5v1.5M2 13v3M22 13v3"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/></symbol>
<symbol id="i-sub" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9.5h18"/><path d="m9 15 2 2 4-4"/></symbol>

    if(t.s < 0 || t.refund) arr.push({d:parseD(t.d), s:-t.s, n:t.n, cat:TX2CAT[t.c]||t.c||'other'});
  }
  return arr;
}
function sums(){
  var si=0, ss=0, i;
  for(i=0;i<(D.incomes||[]).length;i++) si += D.incomes[i].s;
  for(i=0;i<(D.spends||[]).length;i++) ss += D.spends[i].s;
  return {inc:si, spend:ss};
}
function realBal(){ var t=sums(); return (D.baseBalance||0) + t.inc - t.spend; }
function inCycle(dt, cs){ var ce=addM(cs,1); return dt >= cs && dt < ce; }
function nextPay(days){
  var now = new Date(); var sum=0;
  for(var i=0;i<D.pays.length;i++){
    var diff = (D.pays[i].d - now.getDate() + 31) % 31;
    if(diff <= days) sum += D.pays[i].s;
  }
  for(var j=0;j<D.insts.length;j++){
    var dd = parseD(D.insts[j].d);
    var d2 = Math.round((dd - now) / 864e5);
    if(d2 >= 0 && d2 <= days) sum += D.insts[j].s;
  }
  return sum;
}

function calcMonthlyFixedPay() {
  var sum=0;
  for(var i=0;i<D.pays.length;i++) sum += D.pays[i].s;
  for(var j=0;j<D.subs.length;j++) if(!D.subs[j].off) sum += D.subs[j].s;
  return sum;
}
function calcSafeBalance() {
  var real=realBal();
  var upcoming=nextPay(30);
  return Math.max(0, real - upcoming);
}
function calcDailyLimit() {
  var safe=calcSafeBalance();
  var now=new Date();
  var salaryDay=D.salaryDay||20;
  var daysLeft = ((salaryDay - now.getDate()) + 30) % 30 || 30;
  return { perDay: Math.round(safe / daysLeft), daysLeft: daysLeft };
}
function calcHealthScore() {
  var score=50;
  var safe=calcSafeBalance();
  var cushion=(D.goals&&D.goals.cushion)||0;
  var cushionTarget=(D.goals&&D.goals.cushionT)||100000;
  score += Math.min(30, Math.round((cushion / cushionTarget) * 30));
  if(safe > 0) score += 20;
  var activeLeaks = D.leaks ? D.leaks.filter(function(x){ return !x.fixed; }).length : 0;
  score -= (activeLeaks * 7);
  return Math.max(10, Math.min(100, score));
}
function ensureSalary(){
  if(!D.incomes) D.incomes=[];
  var cs = cycleStart(new Date());
  var ck = cs.getFullYear()+'-'+cs.getMonth();
  if(D.removedAuto && D.removedAuto.indexOf(ck) !== -1) return;
  var has=false;
  for(var i=0;i<D.incomes.length;i++){ if(D.incomes[i].auto && D.incomes[i].ck === ck) has=true; }
  if(!has) D.incomes.push({id:Date.now(), d:iso(cs), n:'Заработная плата', s:D.income, auto:1, ck:ck});
  save();
}
function periodRange(){
  var now=new Date(); var y=now.getFullYear(), m=now.getMonth();
  var from, to, label;
  if(pMode === 'm'){ from = new Date(y, m+pOff, 1); to = new Date(y, m+pOff+1, 1); label = MONTHS[from.getMonth()]+' '+from.getFullYear(); }
  else if(pMode === 'q'){ from = new Date(y, m+pOff-2, 1); to = new Date(y, m+pOff+1, 1); label = MONTHS_S[from.getMonth()]+' – '+MONTHS_S[(to.getMonth()+11)%12]+' '+to.getFullYear(); }
  else if(pMode === 'y'){ var yy = y+pOff; from = new Date(yy,0,1); to = new Date(yy+1,0,1); label = ''+yy; }
  else { from = new Date(2026,0,1); to = new Date(y+1,0,1); label = 'Всё время'; }
  return {from:from, to:to, label:label};
}

function envMatch(e, x){
  var isTrain = /tutu|электрич|kryukovo/i.test(x.n || '');
  if(e.n.indexOf('Электричка') === 0) return (x.cat === 'transport') && isTrain;
  if(e.n.indexOf('Тройка') === 0) return (x.cat === 'transport') && !isTrain;
  var key = CAT2ENV[x.cat] || 'Личное';
  return e.n.indexOf(key) === 0;
}

  for(var i=0;i<list.length;i++){
    if(!inCycle(list[i].d, cs)) continue;
    var key=list[i].cat||'other';
    map[key]=(map[key]||0)+list[i].s;
  }
  var out=[];
  for(var k in map){ out.push({id:k, n:catById(k).n, s:map[k]}); }
  out.sort(function(a,b){ return b.s - a.s; });
  return out;
}
function drawDonutWith(agg, tot){
  var cv=$('donut'); if(!cv) return;
  var x=cv.getContext('2d');
  x.clearRect(0,0,170,170);
  if(tot <= 0){
    x.fillStyle='#8b91a7'; x.font='600 11px Manrope, sans-serif'; x.textAlign='center';
    x.fillText('Нет трат за период', 85, 85);
    var legend=$('legend'); if(legend) legend.innerHTML='';
    return;
  }
  var cols=['#30d158','#bf5af2','#ff453a','#ff9f0a','#0a84ff','#64d2ff'];
  var a=-Math.PI/2;
  for(var i=0;i<agg.length;i++){
    var w=agg[i].s / tot * Math.PI * 2;
    x.beginPath();
    x.arc(85,85,66,a+0.03,a+w-0.03);
    x.strokeStyle=cols[i%6];
    x.lineWidth=22;
    x.lineCap='round';
    x.stroke();
    a+=w;
  }
  x.fillStyle='#f2f4ff'; x.font='800 17px Manrope, sans-serif'; x.textAlign='center';
  x.fillText(Math.round(tot/1000)+'k', 85, 82);
  x.fillStyle='#8b91a7'; x.font='600 10px Manrope, sans-serif';
  x.fillText('₽ за период', 85, 98);
  var lg='';
  for(i=0;i<agg.length;i++){
    lg += '<div><i style="background:'+cols[i%6]+'"></i>'+agg[i].n+'<b>'+Math.round(agg[i].s/tot*100)+'%</b></div>';
  }
  var legend=$('legend');
  if(legend) legend.innerHTML=lg;
}
function drawBarsFor(sp, r){
  var b=$('bars'); if(!b) return;
  var y=b.getContext('2d');
  var W = b.clientWidth || 320;
  b.width = W*2; b.height=180;
  y.clearRect(0,0,b.width,180);
  var buckets=[]; var i;
  var days=Math.round((r.to - r.from)/864e5);
  if(days <= 32){
    for(i=0;i<days;i++) buckets.push(0);
    for(i=0;i<sp.length;i++){ var idx=Math.floor((sp[i].d - r.from)/864e5); if(idx>=0 && idx<days) buckets[idx]+=sp[i].s; }
  } else {
    var m0 = new Date(r.from.getFullYear(), r.from.getMonth(), 1);
    var cur = new Date(m0);
    while(cur < r.to){ buckets.push(0); cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); }
    for(i=0;i<sp.length;i++){ var mi = (sp[i].d.getFullYear()-m0.getFullYear())*12 + (sp[i].d.getMonth()-m0.getMonth()); if(mi>=0 && mi<buckets.length) buckets[mi]+=sp[i].s; }
  }
  var mx=1;
  for(i=0;i<buckets.length;i++){ if(buckets[i] > mx) mx=buckets[i]; }
  var bw = b.width / Math.max(1, buckets.length);
  for(i=0;i<buckets.length;i++){
    var h = buckets[i] / mx * 140;
    y.fillStyle = (i === buckets.length-1) ? '#0a84ff' : 'rgba(100,210,255,.35)';
    y.fillRect(i*bw+4, 170-h, Math.max(4, bw-8), Math.max(2, h));
  }
}
function renderAnalytics(){

  var ptot=0;

  var now = new Date();

  var map={};

  var agg=[];
  for(k in map){ agg.push({id:k, n:catById(k).n, s:map[k]}); }

    + '<div class="dig-item"><span>В день</span><b>'+fmt(tot/days)+'</b></div>'
    + '<div class="dig-item"><span>Топ-категория</span><b>'+(agg.length ? agg[0].n : '—')+'</b></div>'
    + '<div class="dig-item"><span>К прошлому периоду</span><b class="'+(delta>0?'soon':'')+'">'+(delta>0?'+':'')+delta+'%</b></div>';
  drawDonutWith(agg.slice(0,6), tot);

      else reply = 'Главная утечка: <b>'+act[0].n+'</b> — '+fmt(act[0].s)+'/мес. '+act[0].adv;
    } else if(s.indexOf('долг') !== -1 || s.indexOf('кредит') !== -1){

    } else reply = 'Спросите: «сколько можно сегодня», «могу купить», «где утечки», «как закрыть долги».';

  if(act === 'nav'){
    var page = el.getAttribute('data-page');
    if(page) go(page);
  }
  else if(act === 'sheet'){ openSheet(el.getAttribute('data-t'), parseInt(el.getAttribute('data-i')||'0',10)); }
  else if(act === 'env'){ openEnv(parseInt(el.getAttribute('data-i'),10)); }
  else if(act === 'edit'){ openEdit(el.getAttribute('data-t'), parseInt(el.getAttribute('data-i')||'0',10)); }
  else if(act === 'add'){ openEdit(el.getAttribute('data-t'), 0); }
  else if(act === 'form-save'){ saveEdit(); }
  else if(act === 'form-del'){ delEdit(); }
  else if(act === 'leak-fix'){
    var id1 = parseInt(el.getAttribute('data-i'),10);
    for(var s1=0;s1<D.leaks.length;s1++){ if(D.leaks[s1].id === id1){ D.leaks[s1].fixed = 1; } }
    save(); render(); toast('Утечка устранена!');
  }
  else if(act === 'learn-done'){
    var id2 = parseInt(el.getAttribute('data-i'),10);
    if(D.learned.indexOf(id2) === -1){ D.learned.push(id2); save(); closeSheet(); render(); toast('Урок изучен!'); }
  }
  else if(act === 'close'){ closeSheet(); }
  else if(act === 'nexttip'){ TIPS.push(TIPS.shift()); var tipText=$('tipText'); if(tipText) tipText.textContent=TIPS[0]; closeSheet(); }
  else if(act === 'balance-edit'){
    var v=prompt('Текущая сумма на всех картах, ₽:');
    if(v===null) return;
    var n=parseFloat(v);
    if(isNaN(n)) return;
    var t=sums();
    D.baseBalance = n - (t.inc - t.spend);
    save(); closeSheet(); render(); toast('Баланс обновлён');
  }
  else if(act === 'income-edit'){
    var in1=$('in1'); var in2=$('in2');
    if(in1) D.income = parseFloat(in1.value) || D.income;
    if(in2) D.salaryDay = parseInt(in2.value) || D.salaryDay;
    save(); closeSheet(); render(); toast('Доход обновлён');
  }
  else if(act === 'spend-add'){
    var spAmt=$('spAmt'); var spCat=$('spCat'); var spNote=$('spNote'); var spDate=$('spDate');
    if(!spAmt || !spCat) return;
    var amt=parseFloat(spAmt.value);
    if(isNaN(amt) || amt<=0){ alert('Введите сумму траты.'); return; }
    var cat=spCat.value||'other';
    var note=spNote?spNote.value.trim():'';
    var d=spDate?spDate.value:iso(new Date());
    D.spends.push({id:Date.now(), d:d, n: note || catById(cat).n, cat:cat, s:amt});
    if(spAmt) spAmt.value='';
    if(spNote) spNote.value='';
    catTouched=false;
    save(); render(); toast('Трата добавлена: −'+fmt(amt));
  }
  else if(act === 'del-spend'){
    var id5=parseInt(el.getAttribute('data-id'),10);
    if(!confirm('Удалить трату?')) return;
    D.spends = D.spends.filter(function(x){ return x.id !== id5; });
    save(); closeSheet(); render(); toast('Трата удалена');
  }
  else if(act === 'addincome'){
    var body=$('sheetBody');
    if(!body) return;
    body.innerHTML = sheetHead('i-in','c-grn','Добавить поступление','сумма попадёт в реальный остаток')
      + '<div class="form"><div class="row2"><input class="inp" id="incAmt" type="number" placeholder="Сумма, ₽"><input class="inp" id="incDate" type="date" value="'+iso(new Date())+'"></div>'
      + '<input class="inp" id="incNote" placeholder="Что это (подработка, кэшбэк...)"></div>'
      + '<button class="sh-btn" data-act="income-save">Сохранить</button>';
    var sheet=$('sheet'); var shb=$('shb');
    if(sheet) sheet.classList.add('on');
    if(shb) shb.classList.add('on');
  }
  else if(act === 'income-save'){
    var incAmt=$('incAmt'); var incDate=$('incDate'); var incNote=$('incNote');
    if(!incAmt) return;
    var a2=parseFloat(incAmt.value);
    if(isNaN(a2) || a2<=0){ alert('Введите сумму поступления.'); return; }
    D.incomes.push({id:Date.now(), d: incDate?incDate.value:iso(new Date()), n: incNote?incNote.value.trim()||'Поступление':'Поступление', s:a2});
    save(); closeSheet(); render(); toast('Поступление +'+fmt(a2));
  }
  else if(act === 'p-set'){ pMode=el.getAttribute('data-v'); pOff=0; renderAnalytics(); }
  else if(act === 'chip'){ ask(el.getAttribute('data-q')); }
  else if(act === 'send'){ ask(); }
  else if(act === 'exit'){ signOut(auth); }
});

function safeAddEventListener(id, event, handler){
  var el=document.getElementById(id);
  if(el) el.addEventListener(event, handler);
}
var shb=$('shb'); if(shb) shb.addEventListener('click', closeSheet);
safeAddEventListener('q', 'input', renderTx);
var chatIn=$('chatIn');
if(chatIn) chatIn.addEventListener('keydown', function(e){ if(e.key==='Enter') ask(); });
safeAddEventListener('spCat', 'change', function(){ catTouched=true; });
safeAddEventListener('spNote', 'input', function(){ if(!catTouched){ var sc=$('spCat'); if(sc) sc.value=autoCat(this.value); } });

var gbtn=$('googleBtn');
if(gbtn){
  gbtn.addEventListener('click', function(){
    gbtn.textContent='Подключаюсь...';
    signInWithPopup(auth, provider).catch(function(err){
      return signInWithRedirect(auth, provider);
    }).catch(function(err2){
      gbtn.textContent='Войти через Google';
      alert('Не удалось войти: '+((err2&&err2.code)||err2));
    });
  });
}

onAuthStateChanged(auth, function(u){
  if(!u){
    var login=$('login'); var app=$('app');
    if(login) login.classList.remove('hidden');
    if(app) app.classList.add('hidden');
    return;
  }
  uid=u.uid;
  var login=$('login'); var app=$('app');
  if(login) login.classList.add('hidden');
  if(app) app.classList.remove('hidden');
  var name=(u.displayName||'друг').split(' ')[0];
  var hello=$('hello'); if(hello) hello.textContent='Привет, '+name+'!';
  var mMail=$('mMail'); if(mMail) mMail.textContent=name;
  getDoc(doc(db,'users',uid)).then(function(s){
    if(s.exists() && s.data() && s.data().data) D=s.data().data;
    normalize();
    ensureSalary();
    var sel=$('spCat');
    if(sel){
      sel.innerHTML='';
      for(var i=0;i<CATS.length;i++){
        var o=document.createElement('option');
        o.value=CATS[i].id; o.textContent=CATS[i].n;
        sel.appendChild(o);
      }
    }
    var spDate=$('spDate');
    if(spDate) spDate.value=iso(new Date());
    loadPage('panel', function(){
      if(typeof render === 'function') render();
    });
  }).catch(function(){ normalize(); render(); });
});

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
