<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>ТРЕШ...</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener('error', function(e) {
  var d = document.getElementById('dbg');
  if (!d) {
    d = document.createElement('div');
    d.id = 'dbg';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#401010;color:#ffd7d7;padding:10px 14px;font:12px monospace;z-index:99999;white-space:pre-wrap';
    document.body.appendChild(d);
  }
  d.textContent = 'ОШИБКА ПРИЛОЖЕНИЯ: ' + e.message + ' (строка ' + e.lineno + ')';
}, true);
</script>
</head>
<body>


<div id="login" class="page on">
  <div class="lcard glass">
    <div class="logo"><svg class="ic"><use href="#i-trash"/></svg></div>
    <h1>ТРЕШ</h1>
    <p>Семейный бюджет без мусора</p>
    <button id="googleBtn" class="btn-g">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Войти через Google
    </button>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="rail" class="glass">
    <button data-act="nav" data-p="dash" class="on"><svg class="ic"><use href="#i-grid"/></svg><span class="lbl">Панель</span></button>
    <button data-act="nav" data-p="spend"><svg class="ic"><use href="#i-out"/></svg><span class="lbl">Траты</span></button>
    <button data-act="nav" data-p="income"><svg class="ic"><use href="#i-in"/></svg><span class="lbl">Доходы</span></button>
    <button data-act="nav" data-p="budget"><svg class="ic"><use href="#i-map"/></svg><span class="lbl">Бюджет</span></button>
    <button data-act="nav" data-p="learn"><svg class="ic"><use href="#i-book"/></svg><span class="lbl">Обучение</span></button>
    <button data-act="nav" data-p="chat"><svg class="ic"><use href="#i-bot"/></svg><span class="lbl">Копилот</span></button>
    <button data-act="exit"><svg class="ic"><use href="#i-exit"/></svg><span class="lbl">Выйти</span></button>
  </nav>

  <div class="top glass">
    <div class="logo"><svg class="ic"><use href="#i-trash"/></svg></div>
    <div><b>ТРЕШ</b><small>симулятор бюджета</small></div>
    <div class="sync"><i></i><span id="mMail">Firebase</span></div>
  </div>

  <div id="pageContent"></div>

  <nav id="bnav">
    <button data-act="nav" data-p="dash" class="on"><svg class="ic"><use href="#i-grid"/></svg><span>Главная</span></button>
    <button data-act="nav" data-p="spend"><svg class="ic"><use href="#i-out"/></svg><span>Траты</span></button>
    <button data-act="nav" data-p="income"><svg class="ic"><use href="#i-in"/></svg><span>Доход</span></button>
    <button data-act="nav" data-p="budget"><svg class="ic"><use href="#i-map"/></svg><span>Бюджет</span></button>
    <button data-act="nav" data-p="learn"><svg class="ic"><use href="#i-book"/></svg><span>Обучение</span></button>
    <button data-act="nav" data-p="chat"><svg class="ic"><use href="#i-bot"/></svg><span>Копилот</span></button>
  </nav>

  <div id="shb"></div>
  <div id="sheet">
    <div class="sheetHead"><h3 id="sheetTitle">Заголовок</h3><button data-act="closeSheet"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="icons.js"></script>
  
<script type="module" src="app.js"></script>
</body>
</html>
